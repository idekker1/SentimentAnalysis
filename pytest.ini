[pytest]
# Where pytest looks for tests when run with no arguments.
testpaths = tests

# Put the repo root on sys.path so tests can do `from src.sentiment_analyzer
# import ...`, the same import form main.py uses. Without this pytest would only
# add tests/ itself and the src package would be invisible.
pythonpath = .

# -q keeps the run readable; --strict-markers turns a typo'd @pytest.mark into an
# error instead of a silently ignored no-op.
addopts = -q --strict-markers

# transformers 4.44 warns about a tokenizer default changing in 4.45. Nothing in
# this project sets that option, so the warning is noise on every model load.
filterwarnings =
    ignore:.*clean_up_tokenization_spaces.*:FutureWarning
